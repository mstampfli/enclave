[package]
name = "enclave-client"
description = "The client app: orchestrates crypto + media + transport behind a WebView UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "enclave_client"
path = "src/lib.rs"

[[bin]]
name = "enclave"
path = "src/main.rs"

[dependencies]
enclave-protocol = { path = "../protocol" }
enclave-crypto = { path = "../crypto" }
enclave-media = { path = "../media" }
enclave-transport = { path = "../transport" }
thiserror.workspace = true
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
wry = { version = "0.55.1", features = ["devtools"] }
tao = "0.35.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
getrandom = "0.2"
chacha20poly1305 = "0.11"
bincode = "1.3"
notify-rust = "4"
zeroize = "1"
hex = "0.4"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
open = "5"
# Phase 6 adds: wry/tao (self-contained WebView window; HTML/CSS/JS front end).

[dev-dependencies]
enclave-transport = { path = "../transport" }

# Linux .deb for the release workflow (`cargo deb -p enclave-client`).
# `$auto` derives the shared-library deps (WebKitGTK, GTK, ALSA, PipeWire) from
# the built binary. The H.264 decoder and the screen-cast portal are loaded at
# runtime, so dpkg-shlibdeps cannot see them: they are listed by hand.
[package.metadata.deb]
name = "enclave"
maintainer = "Marc Stampfli <marc.kurt.stampfli@icloud.com>"
section = "net"
depends = "$auto"
recommends = "gstreamer1.0-libav | gstreamer1.0-plugins-bad, xdg-desktop-portal, pipewire"
extended-description = "End-to-end-encrypted voice, video, and text with a self-hosted relay that forwards ciphertext and never holds your keys."
assets = [
    ["target/release/enclave", "usr/bin/", "755"],
    ["../../deploy/linux/enclave.desktop", "usr/share/applications/", "644"],
    ["../../RUN.md", "usr/share/doc/enclave/", "644"],
]
